[package]
name = "gmrag_api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
aws-config = "1"
aws-sdk-s3 = "1"
base64 = "0.22.1"
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15.7"
lopdf = "0.38.0"
pdf-extract = "0.10.0"
jsonwebtoken = "9.3.1"
regex = "1.12.2"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "uuid", "chrono", "migrate", "json"] }
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
utoipa-swagger-ui = { version = "=9.0.2", default-features = false, features = ["vendored"] }
uuid = { version = "1.23.2", features = ["v4", "serde"] }
text-splitter = { version = "0.30.1", features = ["tiktoken-rs"] }
tiktoken-rs = "0.11.0"
async-stream = "0.3.6"
futures = "0.3.32"
metrics = "0.24.2"
metrics-exporter-prometheus = "0.17.2"
quick-xml = "0.41.0"
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }

[[bin]]
name = "delete-tenant"
path = "src/bin/delete-tenant.rs"

[[bin]]
name = "report-authz-orphans"
path = "src/bin/report-authz-orphans.rs"

[[bin]]
name = "cleanup-authz-orphans"
path = "src/bin/cleanup-authz-orphans.rs"
