services:
  # DB chính cho ứng dụng GMRAG
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gmrag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-gmrag}
    volumes:
      - ./.docker_data/postgres:/var/lib/postgresql/data

  # DB riêng cho OpenFGA (không dùng chung DB với ứng dụng chính)
  openfga-postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${OPENFGA_DB_USER:-fga_user}
      POSTGRES_PASSWORD: ${OPENFGA_DB_PASSWORD:-fga_password}
      POSTGRES_DB: ${OPENFGA_DB_NAME:-openfga}
    volumes:
      - ./.docker_data/openfga_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fga_user -d openfga"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Container chạy migrate database cho OpenFGA trước khi start service chính
  openfga-migrate:
    image: openfga/openfga:v1.5.0
    command: migrate
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://fga_user:fga_password@openfga-postgres:5432/openfga?sslmode=disable
    depends_on:
      openfga-postgres:
        condition: service_healthy

  # Service OpenFGA chính
  openfga:
    image: openfga/openfga:v1.5.0
    command: run
    ports:
      - "8081:8080" # Map cổng 8081 trên host để tránh xung đột với cổng 8080 của API backend GMRAG
      - "8082:8081" # Cổng gRPC
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://fga_user:fga_password@openfga-postgres:5432/openfga?sslmode=disable
      - OPENFGA_PLAYGROUND_ENABLED=true
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully

  # MinIO local object storage cho original PDFs
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./.docker_data/minio:/data

  # Tạo bucket mặc định cho local dev
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-gmrag-documents}
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      /usr/bin/mc mb --ignore-existing local/$$S3_BUCKET;
      /usr/bin/mc anonymous set private local/$$S3_BUCKET;
      "

  # Qdrant — vector store cho Phase 2 retrieval (local demo)
  qdrant:
    image: qdrant/qdrant:v1.18.2
    volumes:
      - ./.docker_data/qdrant:/qdrant/storage

  # Keycloak — IdP duy nhất cho frontend OIDC, bearer JWT và Admin API lookup.
  # Admin console (demo local): http://localhost:8080 — user/pass admin/admin
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      # File phải tên <realm>-realm.json theo convention import-at-startup của Keycloak
      - ./docker/keycloak/gmrag-realm.json:/opt/keycloak/data/import/gmrag-realm.json:ro

  # Storage orphan scan (local demo). Chỉ dry-run/report, không tự động xoá object.
  storage-orphan-scan:
    build:
      context: ./gmrag_api
      dockerfile: ../docker/outbox-workers.Dockerfile
    image: gmrag/outbox-workers:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gmrag_user}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-gmrag}
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-gmrag-documents}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PRESIGN_EXPIRY_SECS: ${S3_PRESIGN_EXPIRY_SECS:-900}
      STORAGE_ORPHAN_SCAN_INTERVAL_SECS: ${STORAGE_ORPHAN_SCAN_INTERVAL_SECS:-3600}
      RUST_LOG: ${RUST_LOG:-info}
    command:
      ["/usr/local/bin/cleanup-storage-objects", "--loop", "--dry-run", "--interval-secs", "${STORAGE_ORPHAN_SCAN_INTERVAL_SECS:-3600}"]
    stop_grace_period: 30s
