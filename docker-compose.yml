name: hrm-rag

services:
  # DB chính cho ứng dụng HRM-RAG
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hrm_rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrm-rag-db-local}
      POSTGRES_DB: ${POSTGRES_DB:-hrm_rag}
    volumes:
      - ./.docker_data/hrm_rag/postgres:/var/lib/postgresql/data

  # DB riêng cho OpenFGA (không dùng chung DB với ứng dụng chính)
  openfga-postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:15433:5432"
    environment:
      POSTGRES_USER: ${OPENFGA_DB_USER:-hrm_fga_user}
      POSTGRES_PASSWORD: ${OPENFGA_DB_PASSWORD:-hrm-fga-db-local}
      POSTGRES_DB: ${OPENFGA_DB_NAME:-hrm_rag_openfga}
    volumes:
      - ./.docker_data/hrm_rag/openfga_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPENFGA_DB_USER:-hrm_fga_user} -d ${OPENFGA_DB_NAME:-hrm_rag_openfga}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Container chạy migrate database cho OpenFGA trước khi start service chính
  openfga-migrate:
    image: openfga/openfga:v1.5.0
    command: migrate
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://${OPENFGA_DB_USER:-hrm_fga_user}:${OPENFGA_DB_PASSWORD:-hrm-fga-db-local}@openfga-postgres:5432/${OPENFGA_DB_NAME:-hrm_rag_openfga}?sslmode=disable
    depends_on:
      openfga-postgres:
        condition: service_healthy

  # Service OpenFGA chính
  openfga:
    image: openfga/openfga:v1.5.0
    command: run
    ports:
      - "127.0.0.1:18081:8080"
      - "127.0.0.1:18082:8081" # Cổng gRPC
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://${OPENFGA_DB_USER:-hrm_fga_user}:${OPENFGA_DB_PASSWORD:-hrm-fga-db-local}@openfga-postgres:5432/${OPENFGA_DB_NAME:-hrm_rag_openfga}?sslmode=disable
      # OpenFGA là gốc tin cậy của toàn hệ thống: ai gọi được API này là ghi thẳng
      # tuple, tự cấp admin trên mọi workspace. Bắt buộc preshared token.
      - OPENFGA_AUTHN_METHOD=preshared
      - OPENFGA_AUTHN_PRESHARED_KEYS=${OPENFGA_API_TOKEN}
      # Playground chỉ chạy được khi authn=none, bật kèm preshared thì container
      # từ chối start. Tắt có chủ đích, không phải quên.
      - OPENFGA_PLAYGROUND_ENABLED=false
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully

  # MinIO local object storage cho original PDFs
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./.docker_data/hrm_rag/minio:/data

  # Tạo bucket mặc định cho local dev
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-hrm-rag-documents}
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      /usr/bin/mc mb --ignore-existing local/$$S3_BUCKET;
      /usr/bin/mc anonymous set private local/$$S3_BUCKET;
      "

  # Qdrant — vector store cho Phase 2 retrieval (local demo)
  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "127.0.0.1:16333:6333"
    volumes:
      - ./.docker_data/hrm_rag/qdrant:/qdrant/storage

  # Ollama local cho embedding ADR-21. Model được operator import từ GGUF q8_0.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ./.docker_data/hrm_rag/ollama:/root/.ollama
      - ./docker/ollama:/models:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  # Keycloak — IdP duy nhất cho frontend OIDC, bearer JWT và Admin API lookup.
  # Admin console (demo local): http://localhost:8080 — user/pass admin/admin
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      # File phải tên <realm>-realm.json theo convention import-at-startup của Keycloak
      - ./docker/keycloak/gmrag-realm.json:/opt/keycloak/data/import/gmrag-realm.json:ro

  # Durable ingestion worker. API/frontend vẫn chạy trên host theo topology local-demo.
  ingestion-worker:
    build:
      context: ./gmrag_api
      dockerfile: ../docker/outbox-workers.Dockerfile
    image: hrm-rag/outbox-workers:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hrm_rag_user}:${POSTGRES_PASSWORD:-hrm-rag-db-local}@postgres:5432/${POSTGRES_DB:-hrm_rag}
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-hrm-rag-documents}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PRESIGN_EXPIRY_SECS: ${S3_PRESIGN_EXPIRY_SECS:-900}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-hrm_rag_document_chunks}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-1024}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      OLLAMA_EMBED_URL: http://ollama:11434/api/embed
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-AITeamVN/Vietnamese_Embedding}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-https://api.deepseek.com/chat/completions}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      GMRAG_GRAPH_EXTRACTION_ENABLED: ${GMRAG_GRAPH_EXTRACTION_ENABLED:-false}
      GMRAG_GRAPH_EXTRACTION_TIMEOUT_SECS: ${GMRAG_GRAPH_EXTRACTION_TIMEOUT_SECS:-60}
      GMRAG_GRAPH_EXTRACTION_STAGE_TIMEOUT_SECS: ${GMRAG_GRAPH_EXTRACTION_STAGE_TIMEOUT_SECS:-300}
      INGESTION_WORKER_POLL_INTERVAL_MS: ${INGESTION_WORKER_POLL_INTERVAL_MS:-1000}
      INGESTION_JOB_LEASE_SECS: ${INGESTION_JOB_LEASE_SECS:-300}
      INGESTION_JOB_MAX_ATTEMPTS: ${INGESTION_JOB_MAX_ATTEMPTS:-5}
      INGESTION_JOB_BATCH_SIZE: ${INGESTION_JOB_BATCH_SIZE:-1}
      INGESTION_JOB_BASE_BACKOFF_SECS: ${INGESTION_JOB_BASE_BACKOFF_SECS:-5}
      INGESTION_JOB_MAX_BACKOFF_SECS: ${INGESTION_JOB_MAX_BACKOFF_SECS:-300}
      GMRAG_EMBEDDING_BATCH_SIZE: ${GMRAG_EMBEDDING_BATCH_SIZE:-32}
      GMRAG_EMBEDDING_CONCURRENCY: ${GMRAG_EMBEDDING_CONCURRENCY:-2}
      GMRAG_EMBEDDING_TIMEOUT_SECS: ${GMRAG_EMBEDDING_TIMEOUT_SECS:-120}
      GMRAG_EMBEDDING_RETRIES: ${GMRAG_EMBEDDING_RETRIES:-1}
      RUST_LOG: ${RUST_LOG:-info}
    command: ["/usr/local/bin/ingestion-worker"]
    stop_grace_period: 30s

  # Authz outbox worker (local demo). Single replica — không scale; không có SKIP LOCKED lease.
  # OPENFGA_STORE_ID do operator tạo store rồi inject (root .env / shell); worker crash-loop tới khi có.
  process-authz-outbox:
    build:
      context: ./gmrag_api
      dockerfile: ../docker/outbox-workers.Dockerfile
    image: hrm-rag/outbox-workers:local
    restart: unless-stopped
    depends_on:
      - postgres
      - openfga
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hrm_rag_user}:${POSTGRES_PASSWORD:-hrm-rag-db-local}@postgres:5432/${POSTGRES_DB:-hrm_rag}
      OPENFGA_API_URL: http://openfga:8080
      OPENFGA_STORE_ID: ${OPENFGA_STORE_ID:-}
      OPENFGA_MODEL_ID: ${OPENFGA_MODEL_ID:-}
      OPENFGA_API_TOKEN: ${OPENFGA_API_TOKEN:-}
      AUTHZ_OUTBOX_BATCH_SIZE: ${AUTHZ_OUTBOX_BATCH_SIZE:-50}
      AUTHZ_OUTBOX_MAX_RETRIES: ${AUTHZ_OUTBOX_MAX_RETRIES:-5}
      AUTHZ_OUTBOX_POLL_INTERVAL_SECS: ${AUTHZ_OUTBOX_POLL_INTERVAL_SECS:-30}
      RUST_LOG: ${RUST_LOG:-info}
    command: ["/usr/local/bin/process-authz-outbox", "--loop"]
    stop_grace_period: 30s

  # Qdrant outbox worker (local demo). Multi-replica an toàn nhờ FOR UPDATE SKIP LOCKED + claim lease.
  process-qdrant-outbox:
    build:
      context: ./gmrag_api
      dockerfile: ../docker/outbox-workers.Dockerfile
    image: hrm-rag/outbox-workers:local
    restart: unless-stopped
    depends_on:
      - postgres
      - qdrant
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hrm_rag_user}:${POSTGRES_PASSWORD:-hrm-rag-db-local}@postgres:5432/${POSTGRES_DB:-hrm_rag}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-hrm_rag_document_chunks}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_OUTBOX_BATCH_SIZE: ${QDRANT_OUTBOX_BATCH_SIZE:-50}
      QDRANT_OUTBOX_MAX_RETRIES: ${QDRANT_OUTBOX_MAX_RETRIES:-5}
      QDRANT_OUTBOX_BASE_BACKOFF_SECS: ${QDRANT_OUTBOX_BASE_BACKOFF_SECS:-2}
      QDRANT_OUTBOX_MAX_BACKOFF_SECS: ${QDRANT_OUTBOX_MAX_BACKOFF_SECS:-300}
      QDRANT_OUTBOX_CLAIM_LEASE_SECS: ${QDRANT_OUTBOX_CLAIM_LEASE_SECS:-120}
      QDRANT_OUTBOX_POLL_INTERVAL_SECS: ${QDRANT_OUTBOX_POLL_INTERVAL_SECS:-30}
      QDRANT_DELETE_WORKER_TIMEOUT_SECS: ${QDRANT_DELETE_WORKER_TIMEOUT_SECS:-60}
      RUST_LOG: ${RUST_LOG:-info}
    command: ["/usr/local/bin/process-qdrant-outbox", "--loop"]
    stop_grace_period: 30s

  # Storage orphan scan (local demo). Chỉ dry-run/report, không tự động xoá object.
  storage-orphan-scan:
    build:
      context: ./gmrag_api
      dockerfile: ../docker/outbox-workers.Dockerfile
    image: hrm-rag/outbox-workers:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hrm_rag_user}:${POSTGRES_PASSWORD:-hrm-rag-db-local}@postgres:5432/${POSTGRES_DB:-hrm_rag}
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-hrm-rag-documents}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PRESIGN_EXPIRY_SECS: ${S3_PRESIGN_EXPIRY_SECS:-900}
      STORAGE_ORPHAN_SCAN_INTERVAL_SECS: ${STORAGE_ORPHAN_SCAN_INTERVAL_SECS:-3600}
      RUST_LOG: ${RUST_LOG:-info}
    command:
      ["/usr/local/bin/cleanup-storage-objects", "--loop", "--dry-run", "--interval-secs", "${STORAGE_ORPHAN_SCAN_INTERVAL_SECS:-3600}"]
    stop_grace_period: 30s
